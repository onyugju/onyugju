<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2445"/>
      <stop offset="0.65" stop-color="#2c3566"/>
      <stop offset="1" stop-color="#5a5a95"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe7a3" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffe7a3" stop-opacity="0"/>
    </radialGradient>
    <path id="star" d="M0,-10 L2.9,-3.1 L10,-3.1 L4.3,1.4 L6.5,8.6 L0,4.3 L-6.5,8.6 L-4.3,1.4 L-10,-3.1 L-2.9,-3.1 Z"/>
    <clipPath id="round"><rect width="900" height="260" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
  <rect width="900" height="260" fill="url(#sky)"/>

  <!-- twinkle dots -->
  <g fill="#fff8e7">
    <circle cx="60" cy="40" r="1.6"><animate attributeName="opacity" values="1;.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="90" r="1.2"><animate attributeName="opacity" values=".3;1;.3" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="30" r="1.8"><animate attributeName="opacity" values="1;.3;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="70" r="1.2"><animate attributeName="opacity" values=".4;1;.4" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="35" r="1.5"><animate attributeName="opacity" values="1;.2;1" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="95" r="1.1"><animate attributeName="opacity" values=".3;1;.3" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="790" cy="30" r="1.7"><animate attributeName="opacity" values="1;.3;1" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="110" r="1.2"><animate attributeName="opacity" values=".4;1;.4" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="40" cy="130" r="1.1"><animate attributeName="opacity" values="1;.4;1" dur="3.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- small stars -->
  <g fill="#b9a7e6">
    <use href="#star" transform="translate(110 55) scale(.7)"><animate attributeName="opacity" values="1;.35;1" dur="3s" repeatCount="indefinite"/></use>
    <use href="#star" transform="translate(720 70) scale(.6)"><animate attributeName="opacity" values=".35;1;.35" dur="2.5s" repeatCount="indefinite"/></use>
  </g>
  <g fill="#f6b9cb">
    <use href="#star" transform="translate(430 75) scale(.5)"><animate attributeName="opacity" values="1;.3;1" dur="2.8s" repeatCount="indefinite"/></use>
    <use href="#star" transform="translate(830 60) scale(.55)"><animate attributeName="opacity" values=".3;1;.3" dur="3.4s" repeatCount="indefinite"/></use>
  </g>

  <!-- big gold star (like the cap badge) -->
  <circle cx="680" cy="150" r="70" fill="url(#glow)"/>
  <g transform="translate(680 150)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="3.2s" repeatCount="indefinite"/>
      <use href="#star" transform="scale(3.4)" fill="#f5c95c" stroke="#1b2445" stroke-width="1" stroke-linejoin="round"/>
      <circle cx="-9" cy="4" r="3" fill="#f6a6bd" opacity=".8"/>
      <circle cx="9" cy="4" r="3" fill="#f6a6bd" opacity=".8"/>
      <circle cx="-5" cy="-3" r="2" fill="#1b2445"/>
      <circle cx="5" cy="-3" r="2" fill="#1b2445"/>
      <path d="M-3 3 Q0 6 3 3" fill="none" stroke="#1b2445" stroke-width="1.6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- fluffy clouds -->
  <g fill="#e9e4fa" opacity=".9">
    <circle cx="0" cy="250" r="55"/><circle cx="80" cy="235" r="48"/><circle cx="160" cy="255" r="50"/>
    <circle cx="760" cy="250" r="50"/><circle cx="840" cy="232" r="52"/><circle cx="910" cy="250" r="50"/>
  </g>
  <g fill="#ffffff">
    <circle cx="30" cy="268" r="50"/><circle cx="115" cy="258" r="42"/><circle cx="200" cy="272" r="44"/>
    <circle cx="300" cy="275" r="40"/><circle cx="400" cy="270" r="38"/><circle cx="500" cy="278" r="40"/>
    <circle cx="600" cy="268" r="42"/><circle cx="700" cy="275" r="44"/><circle cx="800" cy="262" r="46"/><circle cx="890" cy="270" r="44"/>
  </g>

  <!-- title -->
  <text x="70" y="128" font-family="'Trebuchet MS','Arial Rounded MT Bold','Segoe UI',sans-serif" font-size="54" font-weight="700" fill="#fffaf0" letter-spacing="1">onyugju</text>
  <text x="72" y="164" font-family="'Trebuchet MS','Segoe UI',sans-serif" font-size="18" fill="#cdbff0" letter-spacing="2">✦ game planner in training · cute &amp; fun things ✦</text>
  </g>
</svg>
